# Shared by the official image and offline CLAMAV_IMAGE overrides. Do not rely
# on image defaults: an incomplete scan must never be reported as clean.
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
# Leave TCPAddr unset, as in the official image, so its localhost health check
# works with both IPv4 and IPv6 localhost resolution.
User clamav
Foreground yes
LogTime yes
ScanArchive yes
HeuristicAlerts yes
AlertExceedsMax yes
MaxFiles 10000
MaxRecursion 17
MaxScanTime 55000
MaxScanSize 200M
MaxFileSize 100M
StreamMaxLength 100M
