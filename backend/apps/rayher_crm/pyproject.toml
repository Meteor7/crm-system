[project]
name = "rayher_crm"
authors = [
    { name = "QIHENG Demo Semiconductor" }
]
description = "Independent QIHENG Demo CRM application for Frappe and ERPNext"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "pypdf>=3.9,<7",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
