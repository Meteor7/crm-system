name: Release Gate

on:
  pull_request:
  push:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unified release gate
        shell: pwsh
        run: ./backend/tests/run-release-gate.ps1 -StartBackend
