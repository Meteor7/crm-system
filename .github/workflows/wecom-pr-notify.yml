name: Notify WeCom on PR

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  notify:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Use the default-branch workflow even when stacked PR branches lack this file.
      # Keep this metadata-only: never check out or execute PR code with secrets.
      # PR fields are passed through environment variables, not embedded in scripts.
      - name: Validate notification configuration
        env:
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WECOM_BOT_WEBHOOK)) {
            Write-Output "::error::Configure WECOM_BOT_WEBHOOK in repository Actions secrets."
            exit 1
          }

      - name: Notify everyone in WeCom
        env:
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $content = @"
          有新的 PR 等待审核
          仓库：$env:REPOSITORY
          提交人：$env:PR_AUTHOR
          PR：#$env:PR_NUMBER $env:PR_TITLE
          链接：$env:PR_URL
          "@

          $payload = @{
            msgtype = 'text'
            text = @{
              content = $content
              mentioned_list = @('@all')
            }
          } | ConvertTo-Json -Depth 3 -Compress

          try {
            $response = Invoke-RestMethod `
              -Uri $env:WECOM_BOT_WEBHOOK `
              -Method Post `
              -ContentType 'application/json; charset=utf-8' `
              -TimeoutSec 20 `
              -Body ([Text.Encoding]::UTF8.GetBytes($payload))
          } catch {
            # Redact the webhook URL before logging: it is the secret itself.
            $detail = ($_.Exception.Message -replace [regex]::Escape($env:WECOM_BOT_WEBHOOK), '***')
            $detail = ($detail -replace '\s+', ' ').Trim()
            Write-Output "::error::Failed to send the WeCom notification: $detail"
            exit 1
          }

          if ($response.errcode -ne 0) {
            # errcode/errmsg come from WeCom's response body and never contain the webhook URL.
            Write-Output "::error::WeCom rejected the notification request (errcode=$($response.errcode) errmsg=$($response.errmsg))."
            exit 1
          }
